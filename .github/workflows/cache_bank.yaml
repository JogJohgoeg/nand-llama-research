name: Integer normalized prefix byte cache
on:
  push:
    branches: [main]
    paths: [".github/workflows/cache_bank.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/cache_bank.py", "integer_opt/ff_recompute.py", "integer_opt/gate_check.py", "integer_opt/norm_cache.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_model.py", "integer_opt/prefix_packed_model.py", "integer_opt/reverse_attention.c", "integer_opt/reverse_kv.py", "integer_opt/ring_model.py", "integer_opt/workspace_model.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/cache_bank.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/cache_bank.py", "integer_opt/ff_recompute.py", "integer_opt/gate_check.py", "integer_opt/norm_cache.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_model.py", "integer_opt/prefix_packed_model.py", "integer_opt/reverse_attention.c", "integer_opt/reverse_kv.py", "integer_opt/ring_model.py", "integer_opt/workspace_model.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove every cache D and replay actual C bytes through NAND and RTL
        run: python3 integer_opt/cache_bank.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-cache-bank
          path: |
            build/integer_opt/cache_bank/*.json
            build/integer_opt/cache_bank/*.c
            build/integer_opt/cache_bank/*.v
            build/integer_opt/cache_bank/*.nl
            build/integer_opt/cache_bank/*.blif
            build/integer_opt/cache_bank/*.ys
            build/integer_opt/cache_bank/*.log
            build/integer_opt/cache_bank/*.txt
          retention-days: 30
