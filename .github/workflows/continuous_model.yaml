name: Integer continuous storage model
on:
  push:
    branches: [main]
    paths: ['integer_opt/continuous_model.py', 'integer_opt/continuous_banks.py', 'integer_opt/circulate_access.c', 'integer_opt/prefix_circulate_access.c', 'integer_opt/pilot_circulate.py', 'integer_opt/ff_recompute.py', 'integer_opt/prefix_model.py', 'integer_opt/prefix_access.c', 'integer_opt/ring_model.py', 'integer_opt/ring_access.c', 'integer_opt/workspace_model.py', 'integer/int_model.c', 'physical/model.bin', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/continuous_model.yaml']
  pull_request:
    paths: ['integer_opt/continuous_model.py', 'integer_opt/continuous_banks.py', 'integer_opt/circulate_access.c', 'integer_opt/prefix_circulate_access.c', 'integer_opt/pilot_circulate.py', 'integer_opt/ff_recompute.py', 'integer_opt/prefix_model.py', 'integer_opt/prefix_access.c', 'integer_opt/ring_model.py', 'integer_opt/ring_access.c', 'integer_opt/workspace_model.py', 'integer/int_model.c', 'physical/model.bin', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/continuous_model.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only Yosys and ABC
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Verify full C16 and C32 against frozen C with actual read faults
        run: |
          python3 integer_opt/continuous_model.py --context 16
          python3 integer_opt/continuous_model.py --context 32
      - name: Prove every current-state and input bit of actual banks
        run: python3 integer_opt/continuous_banks.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-continuous-model
          path: build/integer_opt/continuous_model/
          retention-days: 30
