name: Integer FF down projection
on:
  push:
    branches: [main]
    paths: ['integer_opt/down_engine.py', 'integer_opt/linear_engine.py', 'integer_opt/weight_cursor.py', 'integer_opt/ff_row.py', 'integer_opt/silu_pipeline.py', 'integer_opt/scale_pipeline.py', 'integer_opt/weights.py', 'integer_opt/weights_golden.c', 'integer_opt/gate_check.py', 'integer_opt/prefix_codec.py', 'integer_opt/pilot_units/**', 'integer/int_model.c', 'physical/model.bin', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'physical/units/**', 'bench.py', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/down_engine.yaml']
  pull_request:
    paths: ['integer_opt/down_engine.py', 'integer_opt/linear_engine.py', 'integer_opt/weight_cursor.py', 'integer_opt/ff_row.py', 'integer_opt/silu_pipeline.py', 'integer_opt/scale_pipeline.py', 'integer_opt/weights.py', 'integer_opt/weights_golden.c', 'integer_opt/gate_check.py', 'integer_opt/prefix_codec.py', 'integer_opt/pilot_units/**', 'integer/int_model.c', 'physical/model.bin', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'physical/units/**', 'bench.py', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/down_engine.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and source simulators
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Check true down weights, padded final group and all128 result rows
        run: python3 integer_opt/down_engine.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-down-engine
          path: |
            build/integer_opt/down_engine/**/*.json
            build/integer_opt/down_engine/**/*.nl
            build/integer_opt/down_engine/**/*.v
            build/integer_opt/down_engine/**/*.c
            build/integer_opt/down_engine/**/*.txt
            build/integer_opt/down_engine/**/*.log
            build/integer_opt/down_engine/**/*.blif
            build/integer_opt/down_engine/**/*.ys
          retention-days: 30
