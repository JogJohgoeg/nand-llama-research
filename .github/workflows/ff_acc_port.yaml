name: Integer FF accumulator port
on:
  push:
    branches: [main]
    paths: ['integer_opt/ff_acc_port.py', 'integer_opt/ff_halfword.py', 'integer_opt/prefix_store.py', 'integer_opt/block_kv_model.py', 'integer_opt/block_kv_access.c', 'integer_opt/block_attention.c', 'integer_opt/continuous_model.py', 'integer_opt/circulate_access.c', 'integer_opt/prefix_circulate_access.c', 'integer_opt/ff_recompute.py', 'integer_opt/ring_model.py', 'integer_opt/workspace_model.py', 'integer_opt/ring_access.c', 'integer_opt/prefix_access.c', 'physical/model.bin', 'docs/index.html', 'integer/int_model.c', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/ff_acc_port.yaml']
  pull_request:
    paths: ['integer_opt/ff_acc_port.py', 'integer_opt/ff_halfword.py', 'integer_opt/prefix_store.py', 'integer_opt/block_kv_model.py', 'integer_opt/block_kv_access.c', 'integer_opt/block_attention.c', 'integer_opt/continuous_model.py', 'integer_opt/circulate_access.c', 'integer_opt/prefix_circulate_access.c', 'integer_opt/ff_recompute.py', 'integer_opt/ring_model.py', 'integer_opt/workspace_model.py', 'integer_opt/ring_access.c', 'integer_opt/prefix_access.c', 'physical/model.bin', 'docs/index.html', 'integer/int_model.c', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/ff_acc_port.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove all state transitions, then actual NAND and RTL against frozen C accumulator accesses
        run: python3 integer_opt/ff_acc_port.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-ff-acc-port
          path: |
            build/integer_opt/ff_acc_port/*.json
            build/integer_opt/ff_acc_port/*.c
            build/integer_opt/ff_acc_port/*.v
            build/integer_opt/ff_acc_port/*.nl
            build/integer_opt/ff_acc_port/*.blif
            build/integer_opt/ff_acc_port/*.ys
            build/integer_opt/ff_acc_port/*.log
            build/integer_opt/ff_acc_port/*.txt
          retention-days: 30
