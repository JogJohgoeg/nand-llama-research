name: Integer H slot and FF input
on:
  push:
    branches: [main]
    paths: ['integer_opt/ff_input.py', 'integer_opt/ff_shared.py', 'integer_opt/ff_stream.py', 'integer_opt/ff_row.py', 'integer_opt/ff_store.py', 'integer_opt/ff_bank.py', 'integer_opt/quant_stream.py', 'integer_opt/silu_pipeline.py', 'integer_opt/scale_pipeline.py', 'integer_opt/prefix_store.py', 'integer_opt/prefix_codec.py', 'integer_opt/pilot_units/**', 'integer/int_model.c', 'physical/model.bin', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'physical/units/**', 'bench.py', 'nand.py', 'golden.py', '.github/workflows/ff_input.yaml']
  pull_request:
    paths: ['integer_opt/ff_input.py', 'integer_opt/ff_shared.py', 'integer_opt/ff_stream.py', 'integer_opt/ff_row.py', 'integer_opt/ff_store.py', 'integer_opt/ff_bank.py', 'integer_opt/quant_stream.py', 'integer_opt/silu_pipeline.py', 'integer_opt/scale_pipeline.py', 'integer_opt/prefix_store.py', 'integer_opt/prefix_codec.py', 'integer_opt/pilot_units/**', 'integer/int_model.c', 'physical/model.bin', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'physical/units/**', 'bench.py', 'nand.py', 'golden.py', '.github/workflows/ff_input.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only source simulator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Check actual H refill, in-place A8 and two-pass FF against C99
        run: python3 integer_opt/ff_input.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-ff-input
          path: |
            build/integer_opt/ff_input/*.json
            build/integer_opt/ff_input/*.nl
            build/integer_opt/ff_input/*.v
            build/integer_opt/ff_input/*.c
            build/integer_opt/ff_input/*.txt
            build/integer_opt/ff_input/*.log
          retention-days: 30
