name: Integer FF recomputation
on:
  push:
    branches: [main]
    paths: ['integer_opt/ff_recompute.py', 'integer_opt/ff_bank.py', 'integer_opt/prefix_packed_model.py', 'integer_opt/prefix_codec.py', 'integer_opt/prefix_codec12.py', 'integer_opt/prefix_model.py', 'integer_opt/prefix_access.c', 'integer_opt/workspace_model.py', 'integer_opt/ring_model.py', 'integer_opt/ring_access.c', 'integer/int_model.c', 'physical/model.bin', 'docs/index.html', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/ff_recompute.yaml']
  pull_request:
    paths: ['integer_opt/ff_recompute.py', 'integer_opt/ff_bank.py', 'integer_opt/prefix_packed_model.py', 'integer_opt/prefix_codec.py', 'integer_opt/prefix_codec12.py', 'integer_opt/prefix_model.py', 'integer_opt/prefix_access.c', 'integer_opt/workspace_model.py', 'integer_opt/ring_model.py', 'integer_opt/ring_access.c', 'integer/int_model.c', 'physical/model.bin', 'docs/index.html', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/ff_recompute.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only Yosys and ABC
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Check unchanged complete C values and all FF codes on both profiles
        run: |
          python3 integer_opt/ff_recompute.py --storage-bits 16
          python3 integer_opt/ff_recompute.py --storage-bits 12
      - name: Prove actual FF storage including partial final word
        run: python3 integer_opt/ff_bank.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-ff-recompute
          path: |
            build/integer_opt/ff_recompute*.json
            build/integer_opt/ff_bank/
          retention-days: 30
