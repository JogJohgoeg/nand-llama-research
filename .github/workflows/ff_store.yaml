name: Integer FF storage
on:
  push:
    branches: [main]
    paths: ['integer_opt/ff_store.py', 'integer_opt/ff_bank.py', 'integer_opt/quant_stream.py', 'integer_opt/prefix_codec.py', 'integer_opt/pilot_units/**', 'integer/int_model.c', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/ff_store.yaml']
  pull_request:
    paths: ['integer_opt/ff_store.py', 'integer_opt/ff_bank.py', 'integer_opt/quant_stream.py', 'integer_opt/prefix_codec.py', 'integer_opt/pilot_units/**', 'integer/int_model.c', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/ff_store.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only EDA and source simulator
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Verify two-pass FF requests, scalar writes and word reads against C99
        run: python3 integer_opt/ff_store.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-ff-store
          path: |
            build/integer_opt/ff_store/*.json
            build/integer_opt/ff_store/*.nl
            build/integer_opt/ff_store/*.v
            build/integer_opt/ff_store/*.c
            build/integer_opt/ff_store/*.txt
            build/integer_opt/ff_store/*.blif
            build/integer_opt/ff_store/*.ys
            build/integer_opt/ff_store/*.log
          retention-days: 30
