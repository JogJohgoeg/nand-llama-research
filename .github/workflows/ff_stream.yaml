name: Integer FF recomputation stream
on:
  push:
    branches: [main]
    paths: ['integer_opt/ff_stream.py', 'integer_opt/ff_row.py', 'integer_opt/ff_store.py', 'integer_opt/ff_bank.py', 'integer_opt/quant_stream.py', 'integer_opt/silu_pipeline.py', 'integer_opt/scale_pipeline.py', 'integer_opt/prefix_codec.py', 'integer_opt/pilot_units/**', 'integer/int_model.c', 'physical/model.bin', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'physical/units/**', 'bench.py', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/ff_stream.yaml']
  pull_request:
    paths: ['integer_opt/ff_stream.py', 'integer_opt/ff_row.py', 'integer_opt/ff_store.py', 'integer_opt/ff_bank.py', 'integer_opt/quant_stream.py', 'integer_opt/silu_pipeline.py', 'integer_opt/scale_pipeline.py', 'integer_opt/prefix_codec.py', 'integer_opt/pilot_units/**', 'integer/int_model.c', 'physical/model.bin', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'physical/units/**', 'bench.py', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/ff_stream.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only source simulator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Check both actual FF passes and complete stored A8 vectors
        run: python3 integer_opt/ff_stream.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-ff-stream
          path: |
            build/integer_opt/ff_stream/*.json
            build/integer_opt/ff_stream/*.nl
            build/integer_opt/ff_stream/*.v
            build/integer_opt/ff_stream/*.c
            build/integer_opt/ff_stream/*.txt
            build/integer_opt/ff_stream/*.log
          retention-days: 30
