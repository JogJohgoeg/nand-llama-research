name: Integer FFN shared H read
on:
  push:
    branches: [main]
    paths: [".github/workflows/h_read_shared.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/down_engine.py", "integer_opt/ff_acc_shared.py", "integer_opt/ff_bank.py", "integer_opt/ff_dot_shared.py", "integer_opt/ff_input.py", "integer_opt/ff_input_shared.py", "integer_opt/ff_row.py", "integer_opt/ff_scale_shared.py", "integer_opt/ff_shared.py", "integer_opt/ff_store.py", "integer_opt/ff_stream.py", "integer_opt/ff_writeback.py", "integer_opt/gate_check.py", "integer_opt/linear_engine.py", "integer_opt/norm_ff.py", "integer_opt/norm_ff_shared.py", "integer_opt/ff_sublayer.py", "integer_opt/ff_sublayer_ring.py", "integer_opt/ff_halfword.py", "integer_opt/h_halfword.py", "integer_opt/h_read_shared.py", "integer_opt/norm_stream.py", "integer_opt/pilot_bank.py", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/quant_stream.py", "integer_opt/scale_pipeline.py", "integer_opt/silu_pipeline.py", "integer_opt/weight_cursor.py", "integer_opt/weights_golden.c", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/dot32.nl", "physical/units/resid.nl", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/units/serial_sqrt.nl", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/h_read_shared.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/down_engine.py", "integer_opt/ff_acc_shared.py", "integer_opt/ff_bank.py", "integer_opt/ff_dot_shared.py", "integer_opt/ff_input.py", "integer_opt/ff_input_shared.py", "integer_opt/ff_row.py", "integer_opt/ff_scale_shared.py", "integer_opt/ff_shared.py", "integer_opt/ff_store.py", "integer_opt/ff_stream.py", "integer_opt/ff_writeback.py", "integer_opt/gate_check.py", "integer_opt/linear_engine.py", "integer_opt/norm_ff.py", "integer_opt/norm_ff_shared.py", "integer_opt/ff_sublayer.py", "integer_opt/ff_sublayer_ring.py", "integer_opt/ff_halfword.py", "integer_opt/h_halfword.py", "integer_opt/h_read_shared.py", "integer_opt/norm_stream.py", "integer_opt/pilot_bank.py", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/quant_stream.py", "integer_opt/scale_pipeline.py", "integer_opt/silu_pipeline.py", "integer_opt/weight_cursor.py", "integer_opt/weights_golden.c", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/dot32.nl", "physical/units/resid.nl", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/units/serial_sqrt.nl", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof and source simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove conditional full next-state equivalence and check complete C99 sublayer
        run: python3 integer_opt/h_read_shared.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-h-read-shared
          path: |
            build/integer_opt/h_read_shared/**/*.json
            build/integer_opt/h_read_shared/**/*.nl
            build/integer_opt/h_read_shared/**/*.v
            build/integer_opt/h_read_shared/**/*.c
            build/integer_opt/h_read_shared/**/*.txt
            build/integer_opt/h_read_shared/**/*.log
            build/integer_opt/h_read_shared/**/*.blif
            build/integer_opt/h_read_shared/**/*.ys
          retention-days: 30
