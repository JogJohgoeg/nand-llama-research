name: Integer packed attention store
on:
  push:
    branches: [main]
    paths: [".github/workflows/head_store.yaml", "bench.py", "ci.py", "docs/index.html", "golden.py", "integer/int_model.c", "integer_opt/down_engine.py", "integer_opt/ff_acc_port.py", "integer_opt/ff_acc_shared.py", "integer_opt/ff_bank.py", "integer_opt/ff_continuous.py", "integer_opt/ff_dot_shared.py", "integer_opt/ff_halfword.py", "integer_opt/ff_input.py", "integer_opt/ff_input_shared.py", "integer_opt/ff_row.py", "integer_opt/ff_scale_shared.py", "integer_opt/ff_shared.py", "integer_opt/ff_store.py", "integer_opt/ff_stream.py", "integer_opt/ff_sublayer.py", "integer_opt/ff_sublayer_ring.py", "integer_opt/ff_writeback.py", "integer_opt/gate_check.py", "integer_opt/head_store.py", "integer_opt/kv_client.py", "integer_opt/kv_units/kv_deq.nl", "integer_opt/kv_units/manifest.json", "integer_opt/linear_engine.py", "integer_opt/norm_ff.py", "integer_opt/norm_ff_shared.py", "integer_opt/norm_stream.py", "integer_opt/pilot_bank.py", "integer_opt/pilot_circulate.py", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/quant_stream.py", "integer_opt/ring_model.py", "integer_opt/scale_pipeline.py", "integer_opt/score_dot.py", "integer_opt/score_units/manifest.json", "integer_opt/score_units/score.nl", "integer_opt/silu_pipeline.py", "integer_opt/value_row.py", "integer_opt/weight_cursor.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/head_store.yaml", "bench.py", "ci.py", "docs/index.html", "golden.py", "integer/int_model.c", "integer_opt/down_engine.py", "integer_opt/ff_acc_port.py", "integer_opt/ff_acc_shared.py", "integer_opt/ff_bank.py", "integer_opt/ff_continuous.py", "integer_opt/ff_dot_shared.py", "integer_opt/ff_halfword.py", "integer_opt/ff_input.py", "integer_opt/ff_input_shared.py", "integer_opt/ff_row.py", "integer_opt/ff_scale_shared.py", "integer_opt/ff_shared.py", "integer_opt/ff_store.py", "integer_opt/ff_stream.py", "integer_opt/ff_sublayer.py", "integer_opt/ff_sublayer_ring.py", "integer_opt/ff_writeback.py", "integer_opt/gate_check.py", "integer_opt/head_store.py", "integer_opt/kv_client.py", "integer_opt/kv_units/kv_deq.nl", "integer_opt/kv_units/manifest.json", "integer_opt/linear_engine.py", "integer_opt/norm_ff.py", "integer_opt/norm_ff_shared.py", "integer_opt/norm_stream.py", "integer_opt/pilot_bank.py", "integer_opt/pilot_circulate.py", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/quant_stream.py", "integer_opt/ring_model.py", "integer_opt/scale_pipeline.py", "integer_opt/score_dot.py", "integer_opt/score_units/manifest.json", "integer_opt/score_units/score.nl", "integer_opt/silu_pipeline.py", "integer_opt/value_row.py", "integer_opt/weight_cursor.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove packed s42 numerator and s20 Q storage against frozen C prefixes
        run: python3 integer_opt/head_store.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-head-store
          path: |
            build/integer_opt/head_store/*.json
            build/integer_opt/head_store/*.c
            build/integer_opt/head_store/*.v
            build/integer_opt/head_store/*.nl
            build/integer_opt/head_store/*.blif
            build/integer_opt/head_store/*.ys
            build/integer_opt/head_store/*.log
            build/integer_opt/head_store/*.txt
            build/integer_opt/head_store/values/*.c
            build/integer_opt/head_store/values/*.json
            build/integer_opt/head_store/q/*.c
            build/integer_opt/head_store/q/*.json
          retention-days: 30
