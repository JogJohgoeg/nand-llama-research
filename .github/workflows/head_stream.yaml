name: Integer streaming attention head
on:
  push:
    branches: [main]
    paths: [".github/workflows/head_stream.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/gate_check.py", "integer_opt/head_stream.py", "integer_opt/sample_weight.py", "integer_opt/sampler.py", "nand.py", "physical/export.py", "physical/model.bin"]
  pull_request:
    paths: [".github/workflows/head_stream.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/gate_check.py", "integer_opt/head_stream.py", "integer_opt/sample_weight.py", "integer_opt/sampler.py", "nand.py", "physical/export.py", "physical/model.bin"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  head_stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof and simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator g++
      - name: Whole-head CEC vs RTL, actual graph vs C attention, faults
        run: python3 integer_opt/head_stream.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-head-stream
          path: |
            build/integer_opt/head_stream/*.json
            build/integer_opt/head_stream/*.nl
            build/integer_opt/head_stream/*.txt
            build/integer_opt/head_stream/proofs/*
            build/integer_opt/head_stream/vlt_*/build.log
          retention-days: 30
