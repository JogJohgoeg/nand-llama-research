name: Hierarchical E8 sub-table macro signoff
on:
  push:
    branches: [main]
    paths: [".github/workflows/hier_layout.yaml", "hier_physical/**"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hier-layout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macro:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {groups: 32, block: 0, util: 60}
          - {groups: 32, block: 21, util: 60}
          - {groups: 32, block: 0, util: 50}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install simulators and pinned flow
        run: |
          sudo apt-get update && sudo apt-get install -y verilator iverilog
          pip install librelane==3.0.14
          docker pull ghcr.io/librelane/librelane:3.0.14
      - name: Bind pinned R118 proof, cut sub-table, replay all 512 addresses on RTL
        env:
          GH_TOKEN: ${{ github.token }}
        run: python hier_physical/flow.py prepare ${{ matrix.groups }} ${{ matrix.block }} ${{ matrix.util }}
      - name: Harden sub-table macro on SKY130A
        run: python hier_physical/flow.py harden ${{ matrix.groups }} ${{ matrix.block }}
      - name: Post-route standard-cell replay of all 512 addresses
        run: python hier_physical/flow.py mapped ${{ matrix.groups }} ${{ matrix.block }}
      - name: Report signoff metrics (DRC/LVS/XOR must be zero)
        run: python hier_physical/flow.py report ${{ matrix.groups }} ${{ matrix.block }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hier-k${{ matrix.groups }}-${{ matrix.block }}-u${{ matrix.util }}
          path: |
            build/hier_physical/k${{ matrix.groups }}_${{ matrix.block }}/*.json
            build/hier_physical/k${{ matrix.groups }}_${{ matrix.block }}/*.v
            build/hier_physical/k${{ matrix.groups }}_${{ matrix.block }}/*.txt
            build/hier_physical/k${{ matrix.groups }}_${{ matrix.block }}/*.jsonl
            build/hier_physical/k${{ matrix.groups }}_${{ matrix.block }}/run/final/**
            build/hier_physical/k${{ matrix.groups }}_${{ matrix.block }}/run/**/*.log
            build/hier_physical/k${{ matrix.groups }}_${{ matrix.block }}/run/**/*.rpt
          retention-days: 30
