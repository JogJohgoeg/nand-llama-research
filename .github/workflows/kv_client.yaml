name: Integer cached KV client
on:
  push:
    branches: [main]
    paths: ['integer_opt/kv_client.py', 'integer_opt/kv_units/**', 'integer_opt/pilot_circulate.py', 'integer_opt/prefix_store.py', 'integer/int_model.c', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/kv_client.yaml']
  pull_request:
    paths: ['integer_opt/kv_client.py', 'integer_opt/kv_units/**', 'integer_opt/pilot_circulate.py', 'integer_opt/prefix_store.py', 'integer/int_model.c', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/kv_client.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove capture and stream protocol, then actual complete NAND and RTL vs C
        run: python3 integer_opt/kv_client.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-kv-client
          path: |
            build/integer_opt/kv_client/*.json
            build/integer_opt/kv_client/*.c
            build/integer_opt/kv_client/*.v
            build/integer_opt/kv_client/*.nl
            build/integer_opt/kv_client/*.blif
            build/integer_opt/kv_client/*.ys
            build/integer_opt/kv_client/*.log
            build/integer_opt/kv_client/*.txt
          retention-days: 30
