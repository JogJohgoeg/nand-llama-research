name: Integer K/V packer (head word)
on:
  push:
    branches: [main]
    paths: [".github/workflows/kvpack.yaml", "bench.py", "golden.py", "integer/int_model.c", "integer_opt/kvpack.py", "integer_opt/kvpack_golden.c", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/quant_stream.py", "integer_opt/rope.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/kvpack.yaml", "bench.py", "golden.py", "integer/int_model.c", "integer_opt/kvpack.py", "integer_opt/kvpack_golden.c", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/quant_stream.py", "integer_opt/rope.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kvpack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof and simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator g++
      - name: Shell CEC, actual-graph words vs C, RTL replay and actual faults
        run: python3 integer_opt/kvpack.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-kvpack
          path: |
            build/integer_opt/kvpack/*.json
            build/integer_opt/kvpack/*.nl
            build/integer_opt/kvpack/*.v
            build/integer_opt/kvpack/*.blif
            build/integer_opt/kvpack/*.ys
            build/integer_opt/kvpack/*.log
            build/integer_opt/kvpack/*.txt
            build/integer_opt/kvpack/proofs/*
          retention-days: 30
