name: Integer whole layer 0
on:
  push:
    branches: [main]
    paths: [".github/workflows/layer0.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/final_a8.py", "integer_opt/final_a8_golden.c", "integer_opt/gate_check.py", "integer_opt/headfeed.py", "integer_opt/layer0.py", "integer_opt/layer0_tb.py", "integer_opt/layer0_units/manifest.json", "integer_opt/layer0_units/r52_xbank.nl", "integer_opt/layer0_units/r72_head.nl", "integer_opt/layer0_units/r95_norm_qkv.nl", "integer_opt/layer0_units/r98_ffn.nl", "integer_opt/norm_stream.py", "integer_opt/oproj.py", "integer_opt/quant_stream.py", "integer_opt/rope.py", "integer_opt/sample_weight.py", "integer_opt/sampler.py", "integer_opt/scale_pipeline.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c"]
  pull_request:
    paths: [".github/workflows/layer0.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/final_a8.py", "integer_opt/final_a8_golden.c", "integer_opt/gate_check.py", "integer_opt/headfeed.py", "integer_opt/layer0.py", "integer_opt/layer0_tb.py", "integer_opt/layer0_units/manifest.json", "integer_opt/layer0_units/r52_xbank.nl", "integer_opt/layer0_units/r72_head.nl", "integer_opt/layer0_units/r95_norm_qkv.nl", "integer_opt/layer0_units/r98_ffn.nl", "integer_opt/norm_stream.py", "integer_opt/oproj.py", "integer_opt/quant_stream.py", "integer_opt/rope.py", "integer_opt/sample_weight.py", "integer_opt/sampler.py", "integer_opt/scale_pipeline.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layer0:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof and simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator g++
      - name: Shell CEC, actual layer graph vs int_run layer-0 trace (L=1..3), actual faults
        run: python3 integer_opt/layer0.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-layer0
          path: |
            build/integer_opt/layer0/*.json
            build/integer_opt/layer0/*.nl
            build/integer_opt/layer0/*.txt
            build/integer_opt/layer0/*.log
            build/integer_opt/layer0/proofs/*
            build/integer_opt/layer0/vlt_source/layer0.v
            build/integer_opt/layer0/vlt_source/tb.cpp
          retention-days: 30
