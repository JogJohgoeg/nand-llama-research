ger_opt/vocab_pick.py", "integer_opt/vocab_row.py", "integer_opt/vocab_scale.py", "integer_opt/vocab_scan.py", "integer_opt/weight_cursor.py", "integer_opt/weight_order.py", "integer_opt/weights.py", "integer_opt/x_head_s.py", "integer_opt/xhead_port.py", "integer_opt/xheadn.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine_stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof and simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator g++
      - name: Machine shell CEC, actual whole-machine graph tokens -> next token vs C (L=1..3), front-end fault
        run: H3_MACHINE_OUT=build/integer_opt/machine_stream python3 integer_opt/machine.py --cloud --shared --stream
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-machine-stream
          path: |
            build/integer_opt/machine_stream/*.json
            build/integer_opt/machine_stream/*.txt
            build/integer_opt/machine_stream/shell.nl
            build/integer_opt/machine_stream/proofs/*
            build/integer_opt/machine_stream/vlt_*/build.log
          retention-days: 30
