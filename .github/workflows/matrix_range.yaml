name: Integer bounded matrix weight selector
on:
  push:
    branches: [main]
    paths: [".github/workflows/matrix_range.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/cache_bank.py", "integer_opt/cache_client.py", "integer_opt/cache_matrix.py", "integer_opt/ff_recompute.py", "integer_opt/gate_check.py", "integer_opt/linear_engine.py", "integer_opt/matrix_range.py", "integer_opt/norm_cache.py", "integer_opt/pilot_bank.py", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/pilot_units/weights_layer0.nl", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_model.py", "integer_opt/prefix_packed_model.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/reverse_attention.c", "integer_opt/reverse_kv.py", "integer_opt/ring_model.py", "integer_opt/scale_pipeline.py", "integer_opt/stage_fused.py", "integer_opt/weight_cursor.py", "integer_opt/weights_golden.c", "integer_opt/workspace_model.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/dot32.nl", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/matrix_range.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/cache_bank.py", "integer_opt/cache_client.py", "integer_opt/cache_matrix.py", "integer_opt/ff_recompute.py", "integer_opt/gate_check.py", "integer_opt/linear_engine.py", "integer_opt/matrix_range.py", "integer_opt/norm_cache.py", "integer_opt/pilot_bank.py", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/pilot_units/weights_layer0.nl", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_model.py", "integer_opt/prefix_packed_model.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/reverse_attention.c", "integer_opt/reverse_kv.py", "integer_opt/ring_model.py", "integer_opt/scale_pipeline.py", "integer_opt/stage_fused.py", "integer_opt/weight_cursor.py", "integer_opt/weights_golden.c", "integer_opt/workspace_model.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/dot32.nl", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove reset and cursor induction, exact weight cofactor, and full C matrix path
        run: python3 integer_opt/matrix_range.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-matrix-range
          path: |
            build/integer_opt/matrix_range/*.json
            build/integer_opt/matrix_range/*.c
            build/integer_opt/matrix_range/*.v
            build/integer_opt/matrix_range/*.nl
            build/integer_opt/matrix_range/*.blif
            build/integer_opt/matrix_range/*.ys
            build/integer_opt/matrix_range/*.log
            build/integer_opt/matrix_range/*.txt
            build/integer_opt/matrix_range/c_vectors/*.json
            build/integer_opt/matrix_range/c_vectors/*.c
          retention-days: 30
