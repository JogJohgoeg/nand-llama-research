name: Integer normalized prefix cache
on:
  push:
    branches: [main]
    paths: [".github/workflows/norm_cache.yaml", "docs/index.html", "integer/int_model.c", "integer_opt/ff_recompute.py", "integer_opt/norm_cache.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_codec12.py", "integer_opt/prefix_model.py", "integer_opt/prefix_packed_model.py", "integer_opt/reverse_attention.c", "integer_opt/reverse_kv.py", "integer_opt/ring_model.py", "integer_opt/sample_stream.c", "integer_opt/sample_stream.py", "integer_opt/workspace_model.py", "physical/model.bin"]
  pull_request:
    paths: [".github/workflows/norm_cache.yaml", "docs/index.html", "integer/int_model.c", "integer_opt/ff_recompute.py", "integer_opt/norm_cache.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_codec12.py", "integer_opt/prefix_model.py", "integer_opt/prefix_packed_model.py", "integer_opt/reverse_attention.c", "integer_opt/reverse_kv.py", "integer_opt/ring_model.py", "integer_opt/sample_stream.c", "integer_opt/sample_stream.py", "integer_opt/workspace_model.py", "physical/model.bin"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        context: [16, 32]
    steps:
      - uses: actions/checkout@v6
      - name: Compare all C bytes in both orders and reject real cache faults
        run: python3 integer_opt/norm_cache.py --context ${{ matrix.context }}
      - name: Recheck cache-free sampler
        if: matrix.context == 16
        run: python3 integer_opt/sample_stream.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-norm-cache-c${{ matrix.context }}
          path: |
            build/integer_opt/norm_cache/*.json
            build/integer_opt/norm_cache/*.c
            build/integer_opt/sample_stream.json
          retention-days: 30
