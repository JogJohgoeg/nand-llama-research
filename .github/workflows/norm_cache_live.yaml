name: Integer norm cache live state
on:
  push:
    branches: [main]
    paths: [".github/workflows/norm_cache_live.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/cache_bank.py", "integer_opt/cache_client.py", "integer_opt/ff_recompute.py", "integer_opt/gate_check.py", "integer_opt/norm_cache.py", "integer_opt/norm_cache_fill.py", "integer_opt/norm_cache_live.py", "integer_opt/norm_cache_shared.py", "integer_opt/norm_stream.py", "integer_opt/pilot_bank.py", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_model.py", "integer_opt/prefix_packed_model.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/quant_stream.py", "integer_opt/reverse_attention.c", "integer_opt/reverse_kv.py", "integer_opt/ring_model.py", "integer_opt/stage_fused.py", "integer_opt/state_projection.py", "integer_opt/weights.py", "integer_opt/workspace_model.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/units/serial_sqrt.nl", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/norm_cache_live.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/cache_bank.py", "integer_opt/cache_client.py", "integer_opt/ff_recompute.py", "integer_opt/gate_check.py", "integer_opt/norm_cache.py", "integer_opt/norm_cache_fill.py", "integer_opt/norm_cache_live.py", "integer_opt/norm_cache_shared.py", "integer_opt/norm_stream.py", "integer_opt/pilot_bank.py", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_model.py", "integer_opt/prefix_packed_model.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/quant_stream.py", "integer_opt/reverse_attention.c", "integer_opt/reverse_kv.py", "integer_opt/ring_model.py", "integer_opt/stage_fused.py", "integer_opt/state_projection.py", "integer_opt/weights.py", "integer_opt/workspace_model.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/units/serial_sqrt.nl", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove retained state projection and replay every producer C clock
        run: python3 integer_opt/norm_cache_live.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-norm-cache-live
          path: |
            build/integer_opt/norm_cache_live/*.json
            build/integer_opt/norm_cache_live/*.c
            build/integer_opt/norm_cache_live/*.v
            build/integer_opt/norm_cache_live/*.nl
            build/integer_opt/norm_cache_live/*.blif
            build/integer_opt/norm_cache_live/*.ys
            build/integer_opt/norm_cache_live/*.log
            build/integer_opt/norm_cache_live/*.txt
            build/integer_opt/norm_cache_live/projection/*.blif
            build/integer_opt/norm_cache_live/projection/*.log
            build/integer_opt/norm_cache_live/c_vectors/*.json
            build/integer_opt/norm_cache_live/c_vectors/*.c
            build/integer_opt/norm_cache_live/weights/*.json
            build/integer_opt/norm_cache_live/weights/*.nl
            build/integer_opt/norm_cache_live/weights/*.v
            build/integer_opt/norm_cache_live/weights/*.blif
            build/integer_opt/norm_cache_live/weights/*.ys
            build/integer_opt/norm_cache_live/weights/*.log
          retention-days: 30
