name: Integer RMSNorm H slot
on:
  push:
    branches: [main]
    paths: ['integer_opt/norm_store.py', 'integer_opt/norm_stream.py', 'integer_opt/prefix_store.py', 'integer_opt/prefix_writer.py', 'integer_opt/prefix_codec.py', 'integer_opt/weights.py', 'integer_opt/gate_check.py', 'integer/int_model.c', 'physical/model.bin', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'integer_opt/pilot_units/**', 'physical/units/**', 'bench.py', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/norm_store.yaml']
  pull_request:
    paths: ['integer_opt/norm_store.py', 'integer_opt/norm_stream.py', 'integer_opt/prefix_store.py', 'integer_opt/prefix_writer.py', 'integer_opt/prefix_codec.py', 'integer_opt/weights.py', 'integer_opt/gate_check.py', 'integer/int_model.c', 'physical/model.bin', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'integer_opt/pilot_units/**', 'physical/units/**', 'bench.py', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/norm_store.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only source simulator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Check exact RMSNorm writes, deferred rotation, reset and H readback
        run: python3 integer_opt/norm_store.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-norm-store
          path: |
            build/integer_opt/norm_store/**/*.json
            build/integer_opt/norm_store/**/*.nl
            build/integer_opt/norm_store/**/*.v
            build/integer_opt/norm_store/**/*.c
            build/integer_opt/norm_store/**/*.txt
            build/integer_opt/norm_store/**/*.log
            build/integer_opt/norm_store/**/*.blif
            build/integer_opt/norm_store/**/*.ys
          retention-days: 30
