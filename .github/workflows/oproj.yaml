name: Integer O projection and residual
on:
  push:
    branches: [main]
    paths: [".github/workflows/oproj.yaml", "bench.py", "golden.py", "integer/int_model.c", "integer_opt/oproj.py", "integer_opt/oproj_golden.c", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/quant_stream.py", "integer_opt/scale_pipeline.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/oproj.yaml", "bench.py", "golden.py", "integer/int_model.c", "integer_opt/oproj.py", "integer_opt/oproj_golden.c", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/quant_stream.py", "integer_opt/scale_pipeline.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oproj:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof and simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator g++
      - name: Shell CEC, actual-graph words vs C, RTL replay and actual faults
        run: python3 integer_opt/oproj.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-oproj
          path: |
            build/integer_opt/oproj/*.json
            build/integer_opt/oproj/*.nl
            build/integer_opt/oproj/*.v
            build/integer_opt/oproj/*.blif
            build/integer_opt/oproj/*.ys
            build/integer_opt/oproj/*.log
            build/integer_opt/oproj/*.txt
            build/integer_opt/oproj/proofs/*
          retention-days: 30
