name: Integer O projection all five layers
on:
  push:
    branches: [main]
    paths: [".github/workflows/oproj_layers.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/gate_check.py", "integer_opt/oproj.py", "integer_opt/oproj_golden.c", "integer_opt/oproj_layers.py", "integer_opt/quant_stream.py", "integer_opt/sample_weight.py", "integer_opt/sampler.py", "integer_opt/scale_pipeline.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/oproj_layers.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/gate_check.py", "integer_opt/oproj.py", "integer_opt/oproj_golden.c", "integer_opt/oproj_layers.py", "integer_opt/quant_stream.py", "integer_opt/sample_weight.py", "integer_opt/sampler.py", "integer_opt/scale_pipeline.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oproj_layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof and simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator g++
      - name: Shell CEC, all-layer table, actual-graph words vs C (5 layers), RTL replay and actual faults
        run: python3 integer_opt/oproj_layers.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-oproj-layers
          path: |
            build/integer_opt/oproj_layers/*.json
            build/integer_opt/oproj_layers/*.nl
            build/integer_opt/oproj_layers/*.v
            build/integer_opt/oproj_layers/*.blif
            build/integer_opt/oproj_layers/*.ys
            build/integer_opt/oproj_layers/*.log
            build/integer_opt/oproj_layers/*.txt
            build/integer_opt/oproj_layers/proofs/*
          retention-days: 30
