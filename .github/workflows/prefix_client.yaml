name: Integer continuous prefix client
on:
  push:
    branches: [main]
    paths: ['integer_opt/prefix_client.py', 'integer_opt/pilot_circulate.py', 'integer_opt/ff_sublayer.py', 'integer/int_model.c', 'physical/model.bin', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'physical/units/resid.nl', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/prefix_client.yaml']
  pull_request:
    paths: ['integer_opt/prefix_client.py', 'integer_opt/pilot_circulate.py', 'integer_opt/ff_sublayer.py', 'integer/int_model.c', 'physical/model.bin', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'physical/units/resid.nl', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/prefix_client.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove full client and check actual NAND and RTL against frozen C
        run: python3 integer_opt/prefix_client.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-prefix-client
          path: |
            build/integer_opt/prefix_client/*.json
            build/integer_opt/prefix_client/*.c
            build/integer_opt/prefix_client/*.v
            build/integer_opt/prefix_client/*.nl
            build/integer_opt/prefix_client/*.blif
            build/integer_opt/prefix_client/*.ys
            build/integer_opt/prefix_client/*.log
            build/integer_opt/prefix_client/*.txt
            build/integer_opt/prefix_client/model_fixtures/**/*.c
          retention-days: 30
