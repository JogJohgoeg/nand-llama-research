name: Integer packed prefix
on:
  push:
    branches: [main]
    paths: ['integer_opt/prefix_codec.py', 'integer_opt/prefix_codec12.py', 'integer_opt/prefix_packed.py', 'integer_opt/ports.py', 'integer_opt/gate_check.py', 'integer/int_model.c', 'physical/nl_sim.c', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/prefix_packed.yaml']
  pull_request:
    paths: ['integer_opt/prefix_codec.py', 'integer_opt/prefix_codec12.py', 'integer_opt/prefix_packed.py', 'integer_opt/ports.py', 'integer_opt/gate_check.py', 'integer/int_model.c', 'physical/nl_sim.c', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/prefix_packed.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: 16
            suffix: ''
          - bits: 12
            suffix: '12'
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only Yosys and ABC
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Verify full-domain codec and actual-size independent bank transition
        run: |
          python3 integer_opt/prefix_codec${{ matrix.suffix }}.py
          python3 integer_opt/prefix_packed.py --storage-bits ${{ matrix.bits }} --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-packed-prefix-${{ matrix.bits }}
          path: |
            build/integer_opt/prefix_codec${{ matrix.suffix }}/*.json
            build/integer_opt/prefix_codec${{ matrix.suffix }}/*.nl
            build/integer_opt/prefix_codec${{ matrix.suffix }}/*.c
            build/integer_opt/prefix_packed${{ matrix.suffix }}/*
          retention-days: 30
