name: Integer R98 FFN all five layers
on:
  push:
    branches: [main]
    paths: [".github/workflows/r98_layers.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/down_engine.py", "integer_opt/ff_acc_shared.py", "integer_opt/ff_bank.py", "integer_opt/ff_dot_shared.py", "integer_opt/ff_halfword.py", "integer_opt/ff_input.py", "integer_opt/ff_input_shared.py", "integer_opt/ff_row.py", "integer_opt/ff_scale_shared.py", "integer_opt/ff_shared.py", "integer_opt/ff_store.py", "integer_opt/ff_stream.py", "integer_opt/ff_sublayer.py", "integer_opt/ff_sublayer_ring.py", "integer_opt/ff_weight_order.py", "integer_opt/ff_writeback.py", "integer_opt/gate_check.py", "integer_opt/h_halfword.py", "integer_opt/h_read_shared.py", "integer_opt/layer0_units/manifest.json", "integer_opt/layer0_units/r98_ffn.nl", "integer_opt/linear_engine.py", "integer_opt/norm_ff.py", "integer_opt/norm_ff_shared.py", "integer_opt/norm_stream.py", "integer_opt/pilot_bank.py", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/quant_stream.py", "integer_opt/r95_layers.py", "integer_opt/r98_layers.py", "integer_opt/r98_layers_golden.c", "integer_opt/scale_pipeline.py", "integer_opt/silu_pipeline.py", "integer_opt/weight_cursor.py", "integer_opt/weight_order.py", "integer_opt/weights.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/r98_layers.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/down_engine.py", "integer_opt/ff_acc_shared.py", "integer_opt/ff_bank.py", "integer_opt/ff_dot_shared.py", "integer_opt/ff_halfword.py", "integer_opt/ff_input.py", "integer_opt/ff_input_shared.py", "integer_opt/ff_row.py", "integer_opt/ff_scale_shared.py", "integer_opt/ff_shared.py", "integer_opt/ff_store.py", "integer_opt/ff_stream.py", "integer_opt/ff_sublayer.py", "integer_opt/ff_sublayer_ring.py", "integer_opt/ff_weight_order.py", "integer_opt/ff_writeback.py", "integer_opt/gate_check.py", "integer_opt/h_halfword.py", "integer_opt/h_read_shared.py", "integer_opt/layer0_units/manifest.json", "integer_opt/layer0_units/r98_ffn.nl", "integer_opt/linear_engine.py", "integer_opt/norm_ff.py", "integer_opt/norm_ff_shared.py", "integer_opt/norm_stream.py", "integer_opt/pilot_bank.py", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/quant_stream.py", "integer_opt/r95_layers.py", "integer_opt/r98_layers.py", "integer_opt/r98_layers_golden.c", "integer_opt/scale_pipeline.py", "integer_opt/silu_pipeline.py", "integer_opt/weight_cursor.py", "integer_opt/weight_order.py", "integer_opt/weights.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r98_layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof and simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator g++
      - name: Layer-0 CEC vs accepted R98, all table entries, actual graph vs C for 5 layers, actual faults
        run: python3 integer_opt/r98_layers.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-r98-layers
          path: |
            build/integer_opt/r98_layers/*.json
            build/integer_opt/r98_layers/*.nl
            build/integer_opt/r98_layers/*.txt
            build/integer_opt/r98_layers/proofs/*
            build/integer_opt/r98_layers/vlt_*/build.log
          retention-days: 30
