name: Integer sampling EXP weight
on:
  push:
    branches: [main]
    paths: [".github/workflows/sample_weight.yaml", "bench.py", "ci.py", "golden.py", "nand.py", "integer/int_model.c", "integer_opt/gate_check.py", "integer_opt/sample_weight.py", "integer_opt/sample_weight_golden.c", "integer_opt/sample_weight_units/baseline.nl", "integer_opt/sample_weight_units/manifest.json", "physical/export.py", "physical/model.bin"]
  pull_request:
    paths: [".github/workflows/sample_weight.yaml", "bench.py", "ci.py", "golden.py", "nand.py", "integer/int_model.c", "integer_opt/gate_check.py", "integer_opt/sample_weight.py", "integer_opt/sample_weight_golden.c", "integer_opt/sample_weight_units/baseline.nl", "integer_opt/sample_weight_units/manifest.json", "physical/export.py", "physical/model.bin"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample_weight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof tools
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Fresh C fixtures, universal baseline/reference/mapped CEC and actual faults
        run: python3 integer_opt/sample_weight.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-sample-weight
          path: |
            build/integer_opt/sample_weight/*.json
            build/integer_opt/sample_weight/*.nl
            build/integer_opt/sample_weight/*.v
            build/integer_opt/sample_weight/*.blif
            build/integer_opt/sample_weight/*.ys
            build/integer_opt/sample_weight/*.log
          retention-days: 30
