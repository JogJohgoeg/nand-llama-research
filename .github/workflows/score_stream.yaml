name: Integer score weight stream
on:
  push:
    branches: [main]
    paths: ["bench.py", "ci.py", "docs/index.html", "golden.py", "integer/int_model.c", "integer_opt/gate_check.py", "integer_opt/ring_model.py", "integer_opt/score_stream.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/exp.nl", "physical/units/manifest.json", "physical/verify.py", ".github/workflows/score_stream.yaml"]
  pull_request:
    paths: ["bench.py", "ci.py", "docs/index.html", "golden.py", "integer/int_model.c", "integer_opt/gate_check.py", "integer_opt/ring_model.py", "integer_opt/score_stream.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/exp.nl", "physical/units/manifest.json", "physical/verify.py", ".github/workflows/score_stream.yaml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove FIFO and maximum control then replay real C score weights and boundary protocols
        run: python3 integer_opt/score_stream.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-score-stream
          path: |
            build/integer_opt/score_stream/*.json
            build/integer_opt/score_stream/*.c
            build/integer_opt/score_stream/*.v
            build/integer_opt/score_stream/*.nl
            build/integer_opt/score_stream/*.blif
            build/integer_opt/score_stream/*.ys
            build/integer_opt/score_stream/*.log
            build/integer_opt/score_stream/*.txt
          retention-days: 30
