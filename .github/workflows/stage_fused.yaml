name: Integer fused work-slot rotation
on:
  push:
    branches: [main]
    paths: [".github/workflows/stage_fused.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/cache_bank.py", "integer_opt/ff_recompute.py", "integer_opt/gate_check.py", "integer_opt/norm_cache.py", "integer_opt/pilot_bank.py", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_model.py", "integer_opt/prefix_packed_model.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/reverse_attention.c", "integer_opt/reverse_kv.py", "integer_opt/ring_model.py", "integer_opt/stage_fused.py", "integer_opt/workspace_model.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/stage_fused.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/cache_bank.py", "integer_opt/ff_recompute.py", "integer_opt/gate_check.py", "integer_opt/norm_cache.py", "integer_opt/pilot_bank.py", "integer_opt/ports.py", "integer_opt/prefix_codec.py", "integer_opt/prefix_model.py", "integer_opt/prefix_packed_model.py", "integer_opt/prefix_store.py", "integer_opt/prefix_writer.py", "integer_opt/reverse_attention.c", "integer_opt/reverse_kv.py", "integer_opt/ring_model.py", "integer_opt/stage_fused.py", "integer_opt/workspace_model.py", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove all stage D and compare both true-data schedules with actual faults
        run: python3 integer_opt/stage_fused.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-stage-fused
          path: |
            build/integer_opt/stage_fused/*.json
            build/integer_opt/stage_fused/*.v
            build/integer_opt/stage_fused/*.nl
            build/integer_opt/stage_fused/*.blif
            build/integer_opt/stage_fused/*.ys
            build/integer_opt/stage_fused/*.log
            build/integer_opt/stage_fused/*.txt
            build/integer_opt/stage_fused/c_vectors/*.json
            build/integer_opt/stage_fused/c_vectors/*.c
          retention-days: 30
