name: Integer stable top40 list
on:
  push:
    branches: [main]
    paths: [".github/workflows/top40.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/gate_check.py", "integer_opt/sample_stream.c", "integer_opt/top40.py", "integer_opt/top40_cases.json", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/top40.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/gate_check.py", "integer_opt/sample_stream.c", "integer_opt/top40.py", "integer_opt/top40_cases.json", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  top40:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof and simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator g++
      - name: Prove all state bits and replay C top40 with actual faults
        run: python3 integer_opt/top40.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-top40
          path: |
            build/integer_opt/top40/*.json
            build/integer_opt/top40/*.nl
            build/integer_opt/top40/*.v
            build/integer_opt/top40/*.blif
            build/integer_opt/top40/*.ys
            build/integer_opt/top40/*.log
            build/integer_opt/top40/*.txt
          retention-days: 30
