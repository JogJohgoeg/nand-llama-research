name: Integer internal denominator value stream
on:
  push:
    branches: [main]
    paths: ['integer_opt/value_denominator.py', 'integer_opt/value_normalize.py', 'physical/golden_slice.c', 'integer_opt/pilot_units/serial_div.nl', 'integer_opt/pilot_units/manifest.json', 'integer_opt/value_compact_mul.py', 'integer_opt/compact_mul.py', 'integer_opt/value_continuous.py', 'integer_opt/value_row.py', 'integer_opt/ff_continuous.py', 'integer_opt/ff_acc_port.py', 'integer_opt/kv_client.py', 'integer_opt/kv_units/**', 'integer_opt/pilot_circulate.py', 'physical/units/serial_mul.nl', 'physical/units/manifest.json', 'integer_opt/ff_halfword.py', 'integer_opt/prefix_store.py', 'integer_opt/block_kv_model.py', 'integer_opt/block_kv_access.c', 'integer_opt/block_attention.c', 'integer_opt/continuous_model.py', 'integer_opt/circulate_access.c', 'integer_opt/prefix_circulate_access.c', 'integer_opt/ff_recompute.py', 'integer_opt/ring_model.py', 'integer_opt/workspace_model.py', 'integer_opt/ring_access.c', 'integer_opt/prefix_access.c', 'physical/model.bin', 'docs/index.html', 'integer/int_model.c', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/value_denominator.yaml']
  pull_request:
    paths: ['integer_opt/value_denominator.py', 'integer_opt/value_normalize.py', 'physical/golden_slice.c', 'integer_opt/pilot_units/serial_div.nl', 'integer_opt/pilot_units/manifest.json', 'integer_opt/value_compact_mul.py', 'integer_opt/compact_mul.py', 'integer_opt/value_continuous.py', 'integer_opt/value_row.py', 'integer_opt/ff_continuous.py', 'integer_opt/ff_acc_port.py', 'integer_opt/kv_client.py', 'integer_opt/kv_units/**', 'integer_opt/pilot_circulate.py', 'physical/units/serial_mul.nl', 'physical/units/manifest.json', 'integer_opt/ff_halfword.py', 'integer_opt/prefix_store.py', 'integer_opt/block_kv_model.py', 'integer_opt/block_kv_access.c', 'integer_opt/block_attention.c', 'integer_opt/continuous_model.py', 'integer_opt/circulate_access.c', 'integer_opt/prefix_circulate_access.c', 'integer_opt/ff_recompute.py', 'integer_opt/ring_model.py', 'integer_opt/workspace_model.py', 'integer_opt/ring_access.c', 'integer_opt/prefix_access.c', 'physical/model.bin', 'docs/index.html', 'integer/int_model.c', 'physical/export.py', 'physical/verify.py', 'physical/nl_sim.c', 'nand.py', 'golden.py', 'ci.py', '.github/workflows/value_denominator.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Prove internal denominator and replay true C heads,16-row bounds, signed means and reset aborts
        run: python3 integer_opt/value_denominator.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-value-denominator
          path: |
            build/integer_opt/value_denominator/*.json
            build/integer_opt/value_denominator/*.c
            build/integer_opt/value_denominator/*.v
            build/integer_opt/value_denominator/*.nl
            build/integer_opt/value_denominator/*.blif
            build/integer_opt/value_denominator/*.ys
            build/integer_opt/value_denominator/*.log
            build/integer_opt/value_denominator/*.txt
          retention-days: 30
