name: Integer complete vocabulary row
on:
  push:
    branches: [main]
    paths: [".github/workflows/vocab_row.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/embed_scalar.py", "integer_opt/embed_scalar_golden.c", "integer_opt/gate_check.py", "integer_opt/scale_bounded_check.py", "integer_opt/vocab_mac_proof.py", "integer_opt/vocab_narrow.py", "integer_opt/vocab_row.py", "integer_opt/vocab_row_golden.c", "integer_opt/vocab_row_units/head_mac.nl", "integer_opt/vocab_row_units/manifest.json", "integer_opt/vocab_scale.py", "integer_opt/vocab_scale_golden.c", "integer_opt/weight_order.py", "integer_opt/weights.py", "integer_opt/weights_golden.c", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  pull_request:
    paths: [".github/workflows/vocab_row.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/embed_scalar.py", "integer_opt/embed_scalar_golden.c", "integer_opt/gate_check.py", "integer_opt/scale_bounded_check.py", "integer_opt/vocab_mac_proof.py", "integer_opt/vocab_narrow.py", "integer_opt/vocab_row.py", "integer_opt/vocab_row_golden.c", "integer_opt/vocab_row_units/head_mac.nl", "integer_opt/vocab_row_units/manifest.json", "integer_opt/vocab_scale.py", "integer_opt/vocab_scale_golden.c", "integer_opt/weight_order.py", "integer_opt/weights.py", "integer_opt/weights_golden.c", "nand.py", "physical/export.py", "physical/model.bin", "physical/nl_sim.c", "physical/verify.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  row:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install cloud-only proof and simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys verilator g++
      - name: Prove bound tables and body; replay every C protocol clock
        run: python3 integer_opt/vocab_row.py --cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integer-vocab-row
          path: |
            build/integer_opt/vocab_row/**/*.json
            build/integer_opt/vocab_row/**/*.nl
            build/integer_opt/vocab_row/**/*.v
            build/integer_opt/vocab_row/**/*.blif
            build/integer_opt/vocab_row/**/*.ys
            build/integer_opt/vocab_row/**/*.log
            build/integer_opt/vocab_row/**/*.txt
          retention-days: 30
