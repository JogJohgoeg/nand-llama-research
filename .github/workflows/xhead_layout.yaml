name: Integer final x to token head layout
on:
  push:
    branches: [main]
    paths: [".github/workflows/xhead_layout.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/circulate.py", "integer_opt/embed_scalar.py", "integer_opt/final_a8.py", "integer_opt/final_a8_golden.c", "integer_opt/final_a8s.py", "integer_opt/gate_check.py", "integer_opt/norm_stream.py", "integer_opt/pick40.py", "integer_opt/pick40_units/manifest.json", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/quant_stream.py", "integer_opt/sample_stream.c", "integer_opt/sample_weight.py", "integer_opt/sample_weight_units/baseline.nl", "integer_opt/sample_weight_units/manifest.json", "integer_opt/sampler.py", "integer_opt/scale_bounded_check.py", "integer_opt/top40.py", "integer_opt/top40_cases.json", "integer_opt/vocab_mac_proof.py", "integer_opt/vocab_narrow.py", "integer_opt/vocab_pick.py", "integer_opt/vocab_pick_units/cases.json", "integer_opt/vocab_pick_units/manifest.json", "integer_opt/vocab_row.py", "integer_opt/vocab_row_units/head_mac.nl", "integer_opt/vocab_row_units/manifest.json", "integer_opt/vocab_scale.py", "integer_opt/vocab_scan.py", "integer_opt/weight_order.py", "integer_opt/weights.py", "integer_opt/x_head_s.py", "integer_opt/x_head_s_units/manifest.json", "nand.py", "physical/constraints.sdc", "physical/export.py", "physical/harden.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/units/serial_sqrt.nl", "physical/verify.py", "xhead_physical/**"]
  pull_request:
    paths: [".github/workflows/xhead_layout.yaml", "bench.py", "ci.py", "golden.py", "integer/int_model.c", "integer_opt/circulate.py", "integer_opt/embed_scalar.py", "integer_opt/final_a8.py", "integer_opt/final_a8_golden.c", "integer_opt/final_a8s.py", "integer_opt/gate_check.py", "integer_opt/norm_stream.py", "integer_opt/pick40.py", "integer_opt/pick40_units/manifest.json", "integer_opt/pilot_units/manifest.json", "integer_opt/pilot_units/serial_div.nl", "integer_opt/quant_stream.py", "integer_opt/sample_stream.c", "integer_opt/sample_weight.py", "integer_opt/sample_weight_units/baseline.nl", "integer_opt/sample_weight_units/manifest.json", "integer_opt/sampler.py", "integer_opt/scale_bounded_check.py", "integer_opt/top40.py", "integer_opt/top40_cases.json", "integer_opt/vocab_mac_proof.py", "integer_opt/vocab_narrow.py", "integer_opt/vocab_pick.py", "integer_opt/vocab_pick_units/cases.json", "integer_opt/vocab_pick_units/manifest.json", "integer_opt/vocab_row.py", "integer_opt/vocab_row_units/head_mac.nl", "integer_opt/vocab_row_units/manifest.json", "integer_opt/vocab_scale.py", "integer_opt/vocab_scan.py", "integer_opt/weight_order.py", "integer_opt/weights.py", "integer_opt/x_head_s.py", "integer_opt/x_head_s_units/manifest.json", "nand.py", "physical/constraints.sdc", "physical/export.py", "physical/harden.py", "physical/model.bin", "physical/nl_sim.c", "physical/units/manifest.json", "physical/units/serial_mul.nl", "physical/units/serial_sqrt.nl", "physical/verify.py", "xhead_physical/**"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integer-xhead-layout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install cloud-only source simulator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Bind pinned R118 proof and replay renamed RTL on the layout prefix
        env:
          GH_TOKEN: ${{ github.token }}
        run: python xhead_physical/flow.py prepare
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xhead-layout-source
          path: |
            build/xhead_physical/*.json
            build/xhead_physical/*.zip
            build/xhead_physical/*.v
            build/xhead_physical/*.nl
            build/xhead_physical/*.txt
            build/xhead_physical/*.log
            build/xhead_physical/*.blif
            build/xhead_physical/*.ys
            build/xhead_physical/*.c
          retention-days: 30
  gds:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          name: xhead-layout-source
          path: build/xhead_physical
      - name: Install pinned flow and OAS converter
        run: |
          pip install librelane==3.0.14 klayout==0.30.4.post1
          sudo apt-get update
          sudo apt-get install -y iverilog
          docker pull ghcr.io/librelane/librelane:3.0.14
          docker inspect ghcr.io/librelane/librelane:3.0.14 --format '{{json .RepoDigests}}' > build/xhead_physical/container_digest.json
      - name: Route the R118 x to token head on SKY130A
        run: python xhead_physical/flow.py harden
      - name: Post-route standard-cell simulation of two complete C transactions
        run: python xhead_physical/flow.py mapped
      - name: Package DRC/LVS-checked GDS and OAS for audit
        run: python xhead_physical/flow.py publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xhead-layout-logs
          path: |
            build/xhead_physical/*.json
            build/xhead_physical/*.jsonl
            build/xhead_physical/run/final/**
            build/xhead_physical/run/**/*.json
            build/xhead_physical/run/**/*.log
            build/xhead_physical/run/**/*.rpt
            build/xhead_physical/run/**/*.lyrdb
            build/xhead_physical/run/**/*.xml
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: xhead-gds-site
          path: build/xhead_physical/site/
          retention-days: 90
